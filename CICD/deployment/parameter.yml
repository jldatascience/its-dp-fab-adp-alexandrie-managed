# CICD/deployment/parameter.yml — its-dp-fab-adp-alexandrie-managed
# AUCUNE RÈGLE au 30/10/2026 : fabric/ ne contient aucun item. Ce fichier n'est pas encore
# référencé par config.yml (clé core.parameter absente) ; l'y ajouter avec la première règle.
#
# Deux familles de règles attendues, au format fabric-cicd 1.4.0 (key_value_replace) :
#   1. Workspace courant (ADP Alexandrie) — item du même dépôt :
#        replace_value: {_ALL_: "$workspace.$id"}
#        replace_value: {_ALL_: "$items.<Type>.<nom>.$id"}
#   2. Workspace Framework de l'environnement cible (modèle ADP MDS), résolu PAR NOM :
#        replace_value:
#          DEV: "$workspace.FR - DP - DEV - FAB - Framework - MANAGED.$items.<Type>.<nom>.$id"
#          ITG: "$workspace.FR - DP - ITG - FAB - Framework - MANAGED.$items.<Type>.<nom>.$id"
#          PPR: "$workspace.FR - DP - PPR - FAB - Framework - MANAGED.$items.<Type>.<nom>.$id"
#          PRD: "$workspace.FR - DP - PRD - FAB - Framework - MANAGED.$items.<Type>.<nom>.$id"
#      Chaque item Framework ainsi visé doit être déclaré dans framework.items de
#      dependencies.yml (sinon DEPS_FRAMEWORK_ITEM_UNDECLARED).
#   Aucune autre référence inter-workspace n'est admise (ADP, BDP, UCS) :
#   DEPS_CROSS_WORKSPACE_FORBIDDEN.
#
# Interdits : GUID de workspace sandbox ou d'environnement en dur (GUID_HARDCODED) et GUID
# littéral dans replace_value (RULE_LITERAL_GUID) ; clés d'environnement en minuscules.
#
# Procédure : après synchronisation Git Integration du workspace DEV (dossier fabric),
# reconstruire les règles à partir des items réellement présents (activités InvokePipeline,
# TridentNotebook, références de Lakehouse…), puis lancer :
#   python ../its-dp-fab-cicd-common/CICD/tools/deploy.py validate --repo .
# jusqu'à zéro erreur (règle sans effet, GUID non couvert et item absent sont bloquants).
